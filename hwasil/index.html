<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>작은 화실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout concept: full-bleed 3D studio room; sketchbook-outline HUD (ink borders on paper) floating on top; the drawing pad is a full-screen sheet over the room. Single committed light look. */
:root {
  --bg: #24201c;
  --chalk: #ece6d9;
  --paper: #fffdf7;
  --ink: #25211d;
  --muted: #6d655b;
  --blue: #2c47c8;
  --yellow: #f3c431;
  --danger: #c7372c;
  --line: rgba(37, 33, 29, 0.18);
  --font-display: 'Gamja Flower', 'Noto Sans KR', system-ui, sans-serif;
  --font-body: 'Noto Sans KR', system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
input { -webkit-user-select: text; user-select: text; }
button { font-family: inherit; color: inherit; }
#stage { position: fixed; inset: 0; background: var(--bg); }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.btn, .chip {
  border: 2px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  font: 400 19px/1 var(--font-display);
  letter-spacing: 0.01em;
}
.btn { padding: 10px 16px; border-radius: 12px; cursor: pointer; }
.btn.primary { background: var(--yellow); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .sitBtn:focus-visible, .seg button:focus-visible, .sw:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; }
button.chip { pointer-events: auto; cursor: pointer; }
.chip b { font-weight: 400; background: var(--yellow); border-radius: 999px; padding: 1px 8px; font-size: 17px; font-variant-numeric: tabular-nums; }

.toast {
  position: absolute;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(176px + env(safe-area-inset-bottom, 0px));
  margin-inline: auto;
  max-width: 420px;
  padding: 10px 16px;
  border: 2px solid var(--ink);
  border-radius: 16px;
  background: var(--paper);
  font-size: 14px;
  line-height: 1.5;
  text-align: center;
}
.sitBtn {
  position: absolute;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(52px + env(safe-area-inset-bottom, 0px));
  pointer-events: auto;
  padding: 16px 22px;
  border: 2px solid var(--ink);
  border-radius: 16px;
  background: var(--yellow);
  box-shadow: 4px 4px 0 var(--ink);
  font: 400 23px/1 var(--font-display);
  cursor: pointer;
}
#viewer { position: fixed; inset: 0; z-index: 26; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(28, 24, 20, 0.94); padding: 16px; }
#viewerCanvas { display: block; background: var(--paper); border: 3px solid #3a2a1c; box-shadow: 0 0 0 8px #6b4a2f, 6px 8px 0 8px rgba(0,0,0,0.35); }
#viewerCap { color: var(--chalk); font: 400 26px/1.2 var(--font-display); text-align: center; overflow-wrap: anywhere; }
.sitBtn[disabled] { background: var(--chalk); box-shadow: none; opacity: 0.85; cursor: default; }

.joy {
  position: absolute;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  width: 128px;
  height: 128px;
  border-radius: 50%;
  background: rgba(255, 253, 247, 0.5);
  border: 2px solid var(--ink);
  pointer-events: auto;
  touch-action: none;
}
.knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: var(--paper);
  border: 2px solid var(--ink);
  transform: translate(-50%, -50%);
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(36, 32, 28, 0.35);
  z-index: 30;
}
.card {
  width: 100%;
  max-width: 380px;
  box-sizing: border-box;
  padding: 26px 22px 22px;
  border: 2px solid var(--ink);
  border-radius: 20px;
  background: var(--paper);
  box-shadow: 6px 6px 0 var(--ink);
}
.card h1 { margin: 0 0 8px; font: 400 40px/1.1 var(--font-display); text-wrap: balance; }
.card p { margin: 0 0 12px; font-size: 15px; line-height: 1.55; }
.card ul { margin: 0 0 16px; padding-left: 20px; font-size: 14px; line-height: 1.7; }
.field { display: flex; flex-direction: column; gap: 6px; margin: 0 0 16px; font-size: 13px; font-weight: 500; }
#codeMsg { margin: -8px 0 14px; color: var(--danger); font-size: 13px; font-weight: 500; }
.field input, .padTop input {
  box-sizing: border-box;
  width: 100%;
  padding: 11px 12px;
  border: 2px solid var(--ink);
  border-radius: 12px;
  background: #fff;
  color: var(--ink);
  font: 400 16px/1.2 var(--font-body);
}
.go { width: 100%; padding: 14px; font-size: 24px; background: var(--yellow); }

/* drawing pad */
#pad, #watch {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--chalk);
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
}
.padTop { display: flex; gap: 8px; align-items: center; }
.padTop input { flex: 1; min-width: 0; }
.padStatus { min-height: 18px; font-size: 13px; color: var(--muted); text-align: center; }
.padStatus.bad { color: var(--danger); font-weight: 700; }
.padBoard { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.watchTitle { flex: 1; min-width: 0; text-align: center; font: 400 26px/1.2 var(--font-display); overflow-wrap: anywhere; }
#padCanvas, #watchCanvas {
  display: block;
  background: var(--paper);
  border: 2px solid var(--ink);
  box-sizing: content-box;
  touch-action: none;
  cursor: crosshair;
  box-shadow: 4px 4px 0 var(--ink);
}
.padTools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: var(--paper); padding: 9px 14px; font: 400 18px/1 var(--font-display); cursor: pointer; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: var(--ink); color: var(--paper); }
.size { display: inline-flex; align-items: center; gap: 8px; font: 400 17px/1 var(--font-display); }
.size input { width: 110px; accent-color: var(--blue); }
.swatches { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; touch-action: pan-x; }
.sw { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); cursor: pointer; padding: 0; }
.sw.on { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--blue); }

/* rooms sheet */
.roomRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 2px solid var(--ink); border-radius: 12px; padding: 10px 14px; background: var(--paper); }
.roomRow .n { font: 400 22px/1 var(--font-display); }
.roomRow .c { font-size: 13px; color: #6f665a; }
#roomsList { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
/* works sheet */
#works, #rooms {
  position: fixed;
  inset: 0;
  z-index: 25;
  background: rgba(36, 32, 28, 0.55);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  width: 100%;
  max-width: 640px;
  max-height: 86%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--paper);
  border: 2px solid var(--ink);
  border-bottom: 0;
  border-radius: 20px 20px 0 0;
}
.sheetHead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheetHead h2 { margin: 0; font: 400 30px/1 var(--font-display); }
#worksGrid { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 2px; touch-action: pan-y; }
.work { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.work canvas { width: 100%; height: auto; border: 2px solid var(--ink); border-radius: 6px; background: var(--chalk); display: block; }
.work .t { font: 400 18px/1.2 var(--font-display); overflow-wrap: anywhere; }
.work .d { font-size: 12px; color: var(--muted); }
.work .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.work .acts .btn { padding: 7px 6px; font-size: 16px; flex: 1 1 40%; white-space: nowrap; }
.work .badge { font-size: 12px; color: var(--blue); font-weight: 700; }
.empty { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div id="stage"></div>

<div id="hud">
  <div class="row">
    <button class="chip" id="worksBtn" type="button">내 그림 <b id="worksCount">0</b></button>
    <button class="chip" id="online" type="button">나 혼자 있는 중</button>
  </div>
  <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
  <button class="sitBtn" id="sitBtn" type="button" hidden>앉아서 그리기</button>
  <button class="sitBtn" id="viewBtn" type="button" hidden>작품 크게 보기</button>
  <div class="joy" id="joy" aria-label="이동 조이스틱"><div class="knob" id="knob"></div></div>
</div>

<div id="pad" hidden>
  <div class="padTop">
    <button class="btn" id="padClose" type="button">닫기</button>
    <input id="padTitle" type="text" maxlength="24" autocomplete="off" placeholder="그림 제목" aria-label="그림 제목">
    <button class="btn primary" id="padSave" type="button">저장</button>
  </div>
  <div class="padStatus" id="padStatus" role="status" aria-live="polite"></div>
  <div class="padBoard" id="padBoard"><canvas id="padCanvas" aria-label="그림판"></canvas></div>
  <div class="padTools">
    <div class="seg" id="tools" role="group" aria-label="도구">
      <button type="button" data-tool="p" class="on">연필</button>
      <button type="button" data-tool="b">붓</button>
      <button type="button" data-tool="e">지우개</button>
    </div>
    <label class="size" for="padSize">굵기 <input id="padSize" type="range" min="2" max="40" value="6"></label>
    <button class="btn" id="padUndo" type="button">되돌리기</button>
    <button class="btn" id="padClear" type="button">전체 지우기</button>
  </div>
  <div class="swatches" id="swatches" role="group" aria-label="색"></div>
</div>

<div id="watch" hidden>
  <div class="padTop">
    <button class="btn" id="watchClose" type="button">닫기</button>
    <div class="watchTitle" id="watchTitle">그림 구경</div>
  </div>
  <div class="padStatus" id="watchStatus" role="status" aria-live="polite"></div>
  <div class="padBoard" id="watchBoard"><canvas id="watchCanvas" aria-label="구경 중인 그림"></canvas></div>
</div>

<div id="works" hidden>
  <div class="sheet" role="dialog" aria-label="내 그림">
    <div class="sheetHead"><h2>내 그림</h2><button class="btn" id="worksClose" type="button">닫기</button></div>
    <p class="empty" id="worksEmpty" hidden>아직 저장한 그림이 없어요. 이젤 앞에 앉아서 첫 그림을 그려 보세요.</p>
    <div id="worksGrid"></div>
  </div>
</div>

<div id="viewer" hidden role="dialog" aria-label="작품 보기">
  <canvas id="viewerCanvas"></canvas>
  <div id="viewerCap"></div>
  <button class="btn" id="viewerClose" type="button">닫기</button>
</div>

<div id="rooms" hidden>
  <div class="sheet" role="dialog" aria-label="화실 고르기">
    <div class="sheetHead"><h2>화실 고르기</h2><button class="btn" id="roomsClose" type="button">닫기</button></div>
    <div id="roomsList"></div>
  </div>
</div>

<div id="intro">
  <div class="card">
    <h1>작은 화실</h1>
    <p>이젤 앞에 앉으면 그림판이 열려요. 그린 그림은 내 그림 목록에 저장돼요.</p>
    <ul>
      <li>왼쪽 아래 조이스틱으로 걷기</li>
      <li>이젤 가까이 가면 앉기 버튼이 나와요</li>
      <li>화실 하나에 20명까지 들어와요. 위쪽 화실 칩을 눌러 다른 화실로 옮길 수 있어요</li>
      <li>누가 그리는 이젤에 가까이 가면 구경할 수 있어요</li>
      <li>내 그림에서 '전시하기'를 누르면 남쪽 문 너머 전시관에 걸려요</li>
    </ul>
    <label class="field" for="codeInput" id="codeField">입장 코드
      <input id="codeInput" type="text" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="초대받은 코드">
    </label>
    <p id="codeMsg" hidden></p>
    <label class="field" for="nameInput">화가 이름
      <input id="nameInput" type="text" maxlength="10" autocomplete="off" placeholder="10자까지">
    </label>
    <button class="btn go" id="startBtn" type="button">입장하기</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="backend.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var T = window.THREE;
  var $ = function (s) { return document.querySelector(s); };
  if (!T) {
    $('#intro').innerHTML = '<div class="card"><h1>불러오지 못했어요</h1><p>인터넷 연결을 확인하고 다시 열어 주세요.</p></div>';
    return;
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20261102);
  const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }
  function sanitize(t) {
    let out = '';
    for (const ch of Array.from(String(t))) {
      const c = ch.codePointAt(0);
      if (c < 32 || c === 127 || (c >= 0x200b && c <= 0x200f) || (c >= 0x2028 && c <= 0x202e) || (c >= 0x2060 && c <= 0x206f) || c === 0xfeff) continue;
      out += ch;
    }
    return out.trim();
  }

  /* ---------- renderer / scene ---------- */
  let renderer;
  try { renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); }
  catch (e) {
    $('#intro').innerHTML = '<div class="card"><h1>3D를 켜지 못했어요</h1><p>이 기기의 브라우저가 WebGL을 지원하지 않는 것 같아요.</p></div>';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  $('#stage').appendChild(renderer.domElement);
  const cv = renderer.domElement;
  const scene = new T.Scene();
  scene.background = new T.Color(0x24201c);
  const camera = new T.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.5, 400);
  function onResize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h; camera.fov = w / h < 1 ? 64 : 52; camera.updateProjectionMatrix();
    if (pad.open) fitPad();
    if (watch.open) fitWatch();
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  const L = (c, o) => new T.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
  const B = (c, o) => new T.MeshBasicMaterial(Object.assign({ color: c }, o || {}));
  function put(g, mesh, x, y, z) { mesh.position.set(x, y, z); g.add(mesh); return mesh; }
  const cyl = (a, b, h, s) => new T.CylinderGeometry(a, b, h, s || 10);
  const bx = (w, h, d) => new T.BoxGeometry(w, h, d);

  /* ---------- the studio room ---------- */
  const RM = { hx: 32, hz: 24, h: 10 };
  const GX = 14, GL = 30, GZ0 = RM.hz, GZ1 = RM.hz + GL, DOOR = 2.4;
  const colliders = [];
  function plankTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const x = c.getContext('2d'), r = mulberry32(7);
    for (let row = 0; row < 8; row++) {
      const y = row * 64; let px = -r() * 200;
      while (px < 512) {
        const len = 180 + r() * 220, v = (r() - 0.5) * 24;
        x.fillStyle = 'rgb(' + Math.round(201 + v) + ',' + Math.round(160 + v * 0.9) + ',' + Math.round(106 + v * 0.8) + ')';
        x.fillRect(px, y, len, 64);
        x.fillStyle = 'rgba(60,38,18,0.35)'; x.fillRect(px, y, 2, 64);
        px += len;
      }
      x.fillStyle = 'rgba(60,38,18,0.45)'; x.fillRect(0, y, 512, 2);
    }
    for (let i = 0; i < 500; i++) { x.fillStyle = 'rgba(80,50,20,' + (r() * 0.08) + ')'; x.fillRect(r() * 512, r() * 512, 20 + r() * 40, 1); }
    const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(7.3, 5.5);
    t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    return t;
  }
  const floor = new T.Mesh(new T.PlaneGeometry(RM.hx * 2, RM.hz * 2), new T.MeshLambertMaterial({ map: plankTexture() }));
  floor.rotation.x = -Math.PI / 2; scene.add(floor);

  const wallMat = L(0xefe8da), baseMat = L(0x8d6b45);
  function wall(w, x, z, ry, mat) {
    const g = new T.Group();
    put(g, new T.Mesh(new T.PlaneGeometry(w, RM.h), mat || wallMat), 0, RM.h / 2, 0);
    put(g, new T.Mesh(new T.PlaneGeometry(w, 0.7), baseMat), 0, 0.35, 0.02);
    g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  }
  wall(RM.hx * 2, 0, -RM.hz, 0);
  wall(RM.hx - DOOR, -(RM.hx + DOOR) / 2, RM.hz, Math.PI);
  wall(RM.hx - DOOR, (RM.hx + DOOR) / 2, RM.hz, Math.PI);
  wall(RM.hz * 2, -RM.hx, 0, Math.PI / 2);
  wall(RM.hz * 2, RM.hx, 0, -Math.PI / 2);

  /* north windows + light on the floor */
  (function () {
    const g = new T.Group(); g.position.set(0, 0, -RM.hz + 0.04); scene.add(g);
    [-18, -9, 0, 9, 18].forEach(x => {
      put(g, new T.Mesh(new T.PlaneGeometry(7, 5), B(0xfff3c8)), x, 5.2, 0);
      const f = L(0xf8f5ee);

        $('#works').hidden = true;
        const ei = (nearIdx >= 0 && !occupied(nearIdx)) ? nearIdx : -1;
        if (ei >= 0) { sitAt(ei); }
        openPad({ work: w, easel: ei });
      });
      const b2 = document.createElement('button'); b2.type = 'button'; b2.className = 'btn'; b2.textContent = '삭제';
      b2.addEventListener('click', async () => {
        if (!delArm[w.id]) {
          delArm[w.id] = setTimeout(() => { delete delArm[w.id]; b2.textContent = '삭제'; b2.classList.remove('danger'); }, 3000);
          b2.textContent = '정말 삭제'; b2.classList.add('danger'); return;
        }
        clearTimeout(delArm[w.id]); delete delArm[w.id];
        try { if (w.exh && galCol) { try { await galCol.doc(uid + '_' + w.id).delete(); } catch (e) {} } await myCol_.doc(w.id).delete(); } catch (e) { b2.textContent = '삭제 실패'; }
      });
      const b3 = document.createElement('button'); b3.type = 'button'; b3.className = 'btn'; b3.textContent = w.exh ? '전시 내리기' : '전시하기';
      b3.addEventListener('click', async () => { b3.disabled = true; await exhibit(w, !w.exh); b3.disabled = false; });
      acts.appendChild(b1); acts.appendChild(b3); acts.appendChild(b2); item.appendChild(acts); grid.appendChild(item);
    });
  }
  $('#worksBtn').addEventListener('click', () => { renderWorks(); $('#works').hidden = false; });
  $('#worksClose').addEventListener('click', () => { $('#works').hidden = true; });
  $('#works').addEventListener('click', e => { if (e.target === $('#works')) $('#works').hidden = true; });

  function sitAt(i) {
    const e = easels[i]; pos.x = e.sit.x; pos.z = e.sit.z; heading = e.heading; camYaw = heading + Math.PI; walkAmp = 0; myEasel = i;
  }
  function sit(i) { sitAt(i); openPad({ easel: i }); }

  /* ---------- live drawing: stream my strokes, watch other people's ---------- */
  let myPeer = null, pumpT = 0, streamT = 0, boardAcc = 0;
  const boards = {}, lastWant = {}, sendQ = [];
  function qEmit(topic, data) {
    if (!roomNS) return;
    sendQ.push([topic, data]);
    if (!pumpT) pumpT = setTimeout(pump, 0);
  }
  function pump() {
    pumpT = 0;
    const it = sendQ.shift();
    if (!it || !roomNS) { sendQ.length = 0; return; }
    roomNS.emit(it[0], it[1]).catch(function () {});
    if (sendQ.length) pumpT = setTimeout(pump, 40);
  }
  function emitStroke(c, idx) {
    if (pad.easel < 0 || !roomNS) return;
    let o = pad.sentOff;
    if (o >= c.p.length) return;
    while (o < c.p.length) {
      const part = c.p.slice(o, o + 400);
      qEmit('ds', { e: pad.easel, s: idx, k: c.k, c: c.c, w: c.w, o: o, p: part });
      o += part.length;
    }
    pad.sentOff = o;
  }
  function scheduleStream() {
    if (streamT || pad.easel < 0 || !roomNS) return;
    streamT = setTimeout(() => { streamT = 0; if (pad.cur) emitStroke(pad.cur, pad.strokes.length); }, 120);
  }
  function emitCount() {
    if (pad.easel < 0) return;
    qEmit('dn', { e: pad.easel, n: pad.strokes.length, W: pad.W, H: pad.H });
  }
  function enqueueFull(to) {
    const e = pad.easel;
    if (e < 0 || !roomNS) return;
    const extra = to ? { to: to } : {};
    qEmit('dn', Object.assign({ e: e, n: 0, W: pad.W, H: pad.H }, extra));
    const all = pad.cur ? pad.strokes.concat([pad.cur]) : pad.strokes;
    all.forEach((s, i) => {
      let o = 0;
      do {
        const part = s.p.slice(o, o + 400);
        qEmit('ds', Object.assign({ e: e, s: i, k: s.k, c: s.c, w: s.w, o: o, p: part }, extra));
        o += part.length;
      } while (o < s.p.length);
    });
  }
  function requestBoard(e) {
    const now = performance.now();
    if (!roomNS || (lastWant[e] && now - lastWant[e] < 3000)) return;
    lastWant[e] = now;
    roomNS.emit('dwant', { e: e }).catch(function () {});
  }
  function onDraw(msg) {
    const d = msg.data;
    if (msg.isMe || !d || typeof d !== 'object') return;
    if (d.to && d.to !== myPeer) return;
    const e = d.e;
    if (!Number.isInteger(e) || e < 0 || e >= easels.length) return;
    if (msg.topic === 'dwant') {
      if (pad.open && pad.easel === e) enqueueFull(msg.peer);
      return;
    }
    let b = boards[e];
    if (msg.topic === 'dn') {
      const W = Number(d.W), H = Number(d.H), n = Number(d.n);
      if (!(W >= 100 && W <= 4000 && H >= 100 && H <= 4000 && Number.isInteger(n) && n >= 0)) return;
      if (!b || b.owner !== msg.peer || b.w !== W || b.h !== H) b = boards[e] = { w: W, h: H, strokes: [], owner: msg.peer, ok: true, dirty: true };
      if (n <= b.strokes.length) { b.strokes.length = n; b.ok = true; }
      else { b.ok = false; requestBoard(e); }
      b.dirty = true;
      return;
    }
    if (msg.topic !== 'ds') return;
    if (!b || b.owner !== msg.peer || !b.ok) { requestBoard(e); return; }
    const s = Number(d.s), o = Number(d.o);
    if (!Number.isInteger(s) || !Number.isInteger(o) || s < 0 || o < 0 || !Array.isArray(d.p) || d.p.length > 800) return;
    if (s > b.strokes.length || b.strokes.length > 2000) { b.ok = false; requestBoard(e); return; }
    let st = b.strokes[s];
    if (!st) {
      if (o !== 0) { b.ok = false; requestBoard(e); return; }
      const k = d.k === 'b' || d.k === 'e' ? d.k : 'p';
      const c = typeof d.c === 'string' && /^#[0-9a-fA-F]{6}$/.test(d.c) ? d.c : '#1c1a18';
      st = { k: k, c: c, w: clamp(Number(d.w) || 6, 1, 80), p: [] };
      b.strokes[s] = st;
    }
    const len = st.p.length;
    if (o > len) { b.ok = false; requestBoard(e); return; }
    const skip = len - o;
    if (skip < d.p.length) {
      if (len + d.p.length - skip > 10000) return;
      for (let i = skip; i < d.p.length; i++) { const v = Number(d.p[i]); st.p.push(isFinite(v) ? clamp(v, -50, 5000) : 0); }
      b.dirty = true;
    }
  }

  /* watching someone draw */
  const watch = { open: false, e: -1 };
  let watchInfo = '';
  function remoteAt(e) { let f = null; remotes.forEach(r => { if (r.e === e) f = r; }); return f; }
  function openWatch(e) {
    resetJoy();
    watch.open = true; watch.e = e; watchInfo = '';
    $('#watch').hidden = false; sitBtn.hidden = true;
    updateWatchInfo();
    requestAnimationFrame(fitWatch);
    if (!boards[e]) requestBoard(e);
  }
  function updateWatchInfo() {
    const r = remoteAt(watch.e), b = boards[watch.e];
    const title = r ? r.name + '님이 그리는 중' : (watch.e + 1) + '번 이젤';
    const status = r ? (b && b.ok ? '실시간으로 보고 있어요' : '그림을 불러오는 중…') : (b ? '그리기를 마쳤어요. 마지막 모습이에요.' : '지금은 아무도 그리고 있지 않아요.');
    if (title + status === watchInfo) return;
    watchInfo = title + status;
    $('#watchTitle').textContent = title; $('#watchStatus').textContent = status;
  }
  function fitWatch() {
    const b = boards[watch.e], W = b ? b.w : 4, H = b ? b.h : 3;
    const board = $('#watchBoard'), aw = board.clientWidth - 14, ah = board.clientHeight - 14;
    if (aw < 20 || ah < 20) return;
    const k = Math.min(aw / W, ah / H), cw = Math.floor(W * k), ch = Math.floor(H * k);
    const dpr = Math.min(window.devicePixelRatio || 1, 2), c = $('#watchCanvas');
    c.style.width = cw + 'px'; c.style.height = ch + 'px';
    c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr);
    paintWork(c, b || { w: 4, h: 3, strokes: [] }, '#ece6d9');
  }
  $('#watchClose').addEventListener('click', () => { watch.open = false; watch.e = -1; $('#watch').hidden = true; });

  /* ---------- other people in the room ---------- */
  let roomNS = null, lastSend = 0, lastSent = '', inRoomCount = 1;
  function addRemote(p) {
    const pr = p.presence || {};
    const col = clamp(Math.floor(Number(pr.c)) || 0, 0, COATS.length - 1);
    const name = sanitize(typeof pr.n === 'string' ? pr.n : '').slice(0, 10) || '화가';
    const av = makeAvatar(COATS[col]);
    const sh = new T.Mesh(blobGeo, blobMat); sh.rotation.x = -Math.PI / 2; sh.position.y = 0.04; av.group.add(sh);
    const plate = makeNamePlate(name); plate.sprite.position.y = 2.85; av.group.add(plate.sprite);
    scene.add(av.group);
    const r = { av: av, plate: plate, name: name, x: 0, z: 0, h: 0, tx: 0, tz: 0, th: 0, w: 0, phase: 0, amp: 0, e: -1, init: false };
    remotes.set(p.peer, r); return r;
  }
  function syncPeers(list) {
    const seen = new Set(); let others = 0;
    list.forEach(p => {
      if (p.isMe && p.sameTab) myPeer = p.peer;
      if (p.kind !== 'viewer' || p.isMe) return;
      others++;
      const pr = p.presence || {};
      if (typeof pr.x !== 'number' || typeof pr.z !== 'number' || !isFinite(pr.x) || !isFinite(pr.z)) return;
      seen.add(p.peer);
      const r = remotes.get(p.peer) || addRemote(p);
      const nm = sanitize(typeof pr.n === 'string' ? pr.n : '').slice(0, 10) || '화가';
      if (nm !== r.name) { r.name = nm; r.plate.set(nm); }
      r.tx = clamp(pr.x, -RM.hx, RM.hx); r.tz = clamp(pr.z, -RM.hz, GZ1);
      r.th = typeof pr.h === 'number' && isFinite(pr.h) ? pr.h : r.th; r.w = pr.w === 1 ? 1 : 0;
      r.e = typeof pr.e === 'number' && pr.e >= 0 && pr.e < easels.length ? Math.floor(pr.e) : -1;
      if (!r.init) { r.x = r.tx; r.z = r.tz; r.h = r.th; r.init = true; }
    });
    remotes.forEach((r, k) => { if (!seen.has(k)) { scene.remove(r.av.group); remotes.delete(k); } });
    remotes.forEach((r, k) => {
      if (r.e < 0) return;
      const b = boards[r.e];
      if (!b || b.owner !== k || !b.ok) requestBoard(r.e);
    });
    inRoomCount = others + 1; updateRoomChip();
  }
  function pushPresence(force) {
    if (!roomNS || !started) return;
    const now = performance.now();
    const patch = { x: Math.round(pos.x * 20) / 20, z: Math.round(pos.z * 20) / 20, h: Math.round(heading * 20) / 20, w: walkAmp > 0.3 ? 1 : 0, n: myName, c: myCol, e: myEasel };
    const k = patch.x + ',' + patch.z + ',' + patch.h + ',' + patch.w + ',' + patch.n + ',' + patch.e;
    if (!force && (k === lastSent || now - lastSend < 100 + Math.min(200, (inRoomCount - 1) * 12))) return;
    lastSend = now; lastSent = k;
    roomNS.presence(patch).catch(function () {});
  }
  /* ---------- several studios (named rooms), 20 people each ---------- */
  const ROOM_CAP = 20, ROOM_MAX = 6;
  let lobby = null, roomNum = 0, switching = false, lobbyPeers = [];
  function roomCount(n) {
    let c = 0;
    lobbyPeers.forEach(p => { if (p.kind === 'viewer' && p.presence && p.presence.r === n) c++; });
    return c;
  }
  function pickRoom() { for (let n = 1; n <= ROOM_MAX; n++) { if (roomCount(n) < ROOM_CAP) return n; } return 1; }
  function updateRoomChip() {
    const el = $('#online');
    if (!lobby) el.textContent = '나 혼자 있는 중';
    else if (!roomNum) el.textContent = '연결 중…';
    else el.textContent = '화실 ' + roomNum + ' · ' + inRoomCount + '/' + ROOM_CAP + '명';
  }
  function clearWorld() {
    remotes.forEach(r => scene.remove(r.av.group)); remotes.clear();
    for (const k in boards) delete boards[k];
    for (const k in lastWant) delete lastWant[k];
    easels.forEach(e => { paintWork(e.cvs, { w: 4, h: 3, strokes: [] }, '#d8d0c0'); e.tex.needsUpdate = true; });
    inRoomCount = 1; myEasel = -1;
  }
  async function enterRoom(n) {
    if (!lobby || switching) return;
    switching = true;
    try {
      if (roomNS && roomNS !== lobby) { try { await roomNS.leave(); } catch (e) {} }
      roomNS = null; sendQ.length = 0; clearWorld();
      let nr = null;
      try { nr = await lobby.join('studio-' + n); } catch (e) { nr = null; }
      if (!nr) nr = lobby;
      roomNS = nr; roomNum = nr === lobby ? 1 : n;
      ['dn', 'ds', 'dwant'].forEach(t => nr.on(t, onDraw));
      nr.onPeers(function (ch) { syncPeers(ch.peers); }, function () { if (roomNS === nr) { roomNS = null; syncPeers([]); } });
      lobby.presence({ r: roomNum }).catch(function () {});
      pushPresence(true);
    } finally { switching = false; updateRoomChip(); }
  }
  function renderRooms() {
    const list = $('#roomsList'); list.textContent = '';
    for (let n = 1; n <= ROOM_MAX; n++) {
      const c = roomCount(n), row = document.createElement('div'); row.className = 'roomRow';
      const nm = document.createElement('div'); nm.className = 'n'; nm.textContent = '화실 ' + n;
      const ct = document.createElement('div'); ct.className = 'c'; ct.textContent = c + '/' + ROOM_CAP + '명';
      const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'btn' + (n === roomNum ? '' : ' primary');
      if (n === roomNum) { bt.textContent = '여기 있어요'; bt.disabled = true; }
      else if (c >= ROOM_CAP) { bt.textContent = '가득 참'; bt.disabled = true; }
      else { bt.textContent = '입장'; bt.addEventListener('click', () => { $('#rooms').hidden = true; enterRoom(n); }); }
      const left = document.createElement('div'); left.className = 'l'; left.appendChild(nm); left.appendChild(ct);
      row.appendChild(left); row.appendChild(bt); list.appendChild(row);
    }
  }
  $('#online').addEventListener('click', () => { if (!lobby || switching) return; renderRooms(); $('#rooms').hidden = false; });
  $('#roomsClose').addEventListener('click', () => { $('#rooms').hidden = true; });
  $('#rooms').addEventListener('click', e => { if (e.target === $('#rooms')) $('#rooms').hidden = true; });
  (async function () {
    try {
      if (!window.claude || !window.claude.use) return;
      const r = await window.claude.use('room');
      if (!r) return;
      lobby = r;
      lobby.onPeers(function (ch) {
        lobbyPeers = ch.peers; updateRoomChip();
        if (!$('#rooms').hidden) renderRooms();
        if (roomNS === lobby) syncPeers(ch.peers);
      }, function () {});
      updateRoomChip();
      await new Promise(res => setTimeout(res, 1400));
      await enterRoom(pickRoom());
    } catch (e) {}
  })();
  initData();

  if (document.fonts && document.fonts.load) {
    document.fonts.load('32px "Gamja Flower"', '화가이름').then(() => { myPlate.set(myName); remotes.forEach(r => r.plate.set(r.name)); }).catch(() => {});
  }

  /* ---------- loop ---------- */
  function update(dt) {
    tNow += dt;
    let ix = joy.x + ((keys['d'] || keys['arrowright']) ? 1 : 0) - ((keys['a'] || keys['arrowleft']) ? 1 : 0);
    let iy = joy.y + ((keys['w'] || keys['arrowup']) ? 1 : 0) - ((keys['s'] || keys['arrowdown']) ? 1 : 0);
    const len = Math.hypot(ix, iy); if (len > 1) { ix /= len; iy /= len; }
    const m = Math.min(1, len);
    if (started && !pad.open && !watch.open && m > 0.08) {
      const sy = Math.sin(camYaw), cy = Math.cos(camYaw);
      const dx = cy * ix - sy * iy, dz = -sy * ix - cy * iy, dl = Math.hypot(dx, dz) || 1, sp = SPEED * m;
      tryMove(dx / dl * sp * dt, dz / dl * sp * dt);
      heading += angDiff(heading, Math.atan2(dx, dz)) * Math.min(1, dt * 12);
      walkAmp = lerp(walkAmp, 1, Math.min(1, dt * 10)); walkPhase += dt * (6 + sp * 0.9);
    } else walkAmp = lerp(walkAmp, 0, Math.min(1, dt * 10));
    swing(me, walkPhase, walkAmp);
    player.position.set(pos.x, 0.0 + Math.abs(Math.sin(walkPhase)) * 0.09 * walkAmp, pos.z);
    player.rotation.y = heading;
    blob.position.set(pos.x, 0.05, pos.z);
    pushPresence(false);
    remotes.forEach(r => {
      const f2 = 1 - Math.exp(-dt * 10), dx = r.tx - r.x, dz = r.tz - r.z;
      const moving = Math.hypot(dx, dz) > 0.05 || r.w === 1;
      r.x += dx * f2; r.z += dz * f2; r.h += angDiff(r.h, r.th) * Math.min(1, dt * 12);
      r.amp = lerp(r.amp, moving ? 1 : 0, Math.min(1, dt * 10)); if (r.amp > 0.05) r.phase += dt * 10;
      r.av.group.position.set(r.x, Math.abs(Math.sin(r.phase)) * 0.09 * r.amp, r.z); r.av.group.rotation.y = r.h;
      swing(r.av, r.phase, r.amp);
      r.plate.sprite.visible = Math.hypot(r.x - pos.x, r.z - pos.z) < 28;
    });
    updateSitBtn(); updateViewBtn();
    easels.forEach(e => {
      e.ring.material.opacity = (e.idx === nearIdx ? 0.9 : 0.4) + 0.12 * Math.sin(tNow * 3 + e.idx);
      e.ring.material.color.set(occupied(e.idx) ? 0xd9342b : 0xf3c431);
    });
    boardAcc += dt;
    if (boardAcc > 0.15) {
      boardAcc = 0;
      for (const k in boards) {
        const b = boards[k];
        if (!b.dirty) continue;
        b.dirty = false;
        const e = easels[Number(k)]; paintWork(e.cvs, b, '#d8d0c0'); e.tex.needsUpdate = true;
        if (watch.open && watch.e === Number(k)) fitWatch();
      }
      if (watch.open) updateWatchInfo();
    }
    if (!started) { camYaw += dt * 0.1; camPitch = 0.4; }
    const f = 1 - Math.exp(-dt * 8);
    camTx += (pos.x - camTx) * f; camTz += (pos.z - camTz) * f;
    camDist += ((started ? 17 : 26) - camDist) * Math.min(1, dt * 2);
    const cp = Math.cos(camPitch);
    const inG = camTz > RM.hz - 0.5;
    const dx = clamp(camTx + Math.sin(camYaw) * cp * camDist, inG ? -GX + 1 : -RM.hx + 1, inG ? GX - 1 : RM.hx - 1);
    const dy = Math.min(RM.h - 1, 2.4 + Math.sin(camPitch) * camDist);
    const dz = clamp(camTz + Math.cos(camYaw) * cp * camDist, inG ? GZ0 + 1 : -RM.hz + 1, inG ? GZ1 - 1 : RM.hz - 1);
    if (!camInit) { camPos.set(dx, dy, dz); camInit = true; } else camPos.lerp(_v.set(dx, dy, dz), 1 - Math.exp(-dt * 10));
    camera.position.copy(camPos);
    camera.lookAt(camTx, 2.0, camTz);
  }
  const camPos = new T.Vector3(), _v = new T.Vector3(); let camInit = false;
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    if (!pad.open && !watch.open) renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  onResize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
